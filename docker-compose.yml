version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: job_portal_db
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: job_internship_portal
    volumes:
      - mongodb_data:/data/db

  # Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_portal_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/job_internship_portal
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: super_production_secret_key_change_in_real_env_987654321
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongodb

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job_portal_frontend
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongodb_data:
    driver: local
