name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Integration & Supertest Suite
        working-directory: ./backend
        run: npm test

      - name: Check Backend Package Vulnerabilities
        working-directory: ./backend
        run: npm audit --audit-level=high

  frontend-checks:
    name: Frontend Compilation & Asset Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile & Build Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Check Frontend Package Vulnerabilities
        working-directory: ./frontend
        run: npm audit --audit-level=high
